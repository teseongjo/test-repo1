<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>농업 지원사업 파일 업로드 대시보드</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#172033;font-family:"Malgun Gothic",Arial,sans-serif}header{padding:28px 5%;background:#1f5b45;color:#fff}h1{margin:0;font-size:28px}header p{margin:8px 0 0;opacity:.88}main{max-width:1500px;margin:auto;padding:24px}.uploadBox{background:#fff;border:2px dashed #8fb6a7;border-radius:16px;padding:28px;text-align:center;margin-bottom:18px}input{display:none}.btn{display:inline-block;background:#256b4f;color:#fff;padding:12px 20px;border-radius:10px;cursor:pointer;font-weight:bold}.note{margin-top:12px;color:#697386;font-size:13px}.status{margin:12px 0;padding:12px 15px;border-radius:10px;background:#eaf4ef;color:#24553e;display:none}#error{background:#fff0f0;color:#a22}#kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi,.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 18px rgba(30,45,65,.08)}.kpi span{font-size:13px;color:#697386}.kpi b{display:block;font-size:23px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:18px}.card h2{font-size:17px;margin:0 0 14px}.chart{height:320px}.wide{grid-column:span 2}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e8edf4;text-align:left;white-space:nowrap}th{background:#f7f9fc}@media(max-width:900px){#kpi{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wide{grid-column:span 1}}@media(max-width:520px){#kpi{grid-template-columns:1fr}main{padding:14px}}</style></head><body><header><h1>농업 지원사업 파일 분석 대시보드</h1><p>CSV 또는 Excel 파일을 선택하면 브라우저에서 자동 분석합니다.</p></header><main><div class="uploadBox"><input id="fileInput" type="file" accept=".csv,.xlsx,.xls"><label class="btn" for="fileInput">CSV / Excel 파일 선택</label><div class="note">권장 컬럼: 신청번호, 접수일자, 읍면, 농가명, 지원품목, 총사업비_원, 보조율_pct, 보조금액_원, 심사결과, 반려사유</div><div id="status" class="status"></div><div id="error" class="status"></div></div><div id="kpi"></div><div class="grid"><div class="card"><h2>심사결과 현황</h2><div class="chart"><canvas id="resultChart"></canvas></div></div><div class="card"><h2>반려사유 분석</h2><div class="chart"><canvas id="reasonChart"></canvas></div></div><div class="card"><h2>읍면별 신청 건수 TOP 10</h2><div class="chart"><canvas id="townChart"></canvas></div></div><div class="card"><h2>지원품목별 보조금액 TOP 10</h2><div class="chart"><canvas id="itemChart"></canvas></div></div><div class="card wide"><h2>월별 신청 추이</h2><div class="chart"><canvas id="monthChart"></canvas></div></div><div class="card wide"><h2 id="issueTitle">이상·점검 대상</h2><div style="overflow:auto"><table><thead><tr><th>신청번호</th><th>농가명</th><th>읍면</th><th>점검 사유</th><th>보조금액</th></tr></thead><tbody id="issueBody"></tbody></table></div></div></div></main><script>const chartInstances={};function showStatus(msg,error=false){const s=document.getElementById('status'),e=document.getElementById('error');s.style.display='none';e.style.display='none';const t=error?e:s;t.textContent=msg;t.style.display='block'}function cleanText(v){return String(v??'').replace(/\r/g,'').trim()}function numberValue(v){if(typeof v==='number')return isFinite(v)?v:0;const s=cleanText(v).replace(/,/g,'').replace(/[원₩%]/g,'').replace(/[^\d.-]/g,'');const n=Number(s);return isFinite(n)?n:0}function normalizeRows(rows){return rows.map(r=>{const o={};Object.keys(r).forEach(k=>o[cleanText(k).replace(/^\uFEFF/,'')]=cleanText(r[k]));['경작면적_ha','총사업비_원','보조율_pct','보조금액_원'].forEach(k=>{if(k in o)o[k]=numberValue(o[k])});return o})}function groupCount(rows,key){const m={};rows.forEach(r=>{let v=cleanText(r[key]);if(!v)v='미상';m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}function groupSum(rows,key,valueKey){const m={};rows.forEach(r=>{let v=cleanText(r[key]);if(!v)v='미상';m[v]=(m[v]||0)+numberValue(r[valueKey])});return Object.entries(m).sort((a,b)=>b[1]-a[1])}function money(n){return new Intl.NumberFormat('ko-KR').format(Math.round(n||0))+'원'}function drawChart(id,type,labels,data,label){if(!window.Chart)throw new Error('차트 라이브러리(Chart.js)를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');if(chartInstances[id])chartInstances[id].destroy();chartInstances[id]=new Chart(document.getElementById(id),{type,data:{labels,datasets:[{label,data,borderWidth:2,borderRadius:6,tension:.3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:type==='pie'}},scales:type==='pie'?{}:{y:{beginAtZero:true}}}})}function renderDashboard(inputRows){const rows=normalizeRows(inputRows);if(!rows.length)throw new Error('읽을 수 있는 데이터가 없습니다.');const eligible=rows.filter(r=>r['심사결과']==='적격').length,rejected=rows.filter(r=>r['심사결과']==='반려').length,totalCost=rows.reduce((a,r)=>a+numberValue(r['총사업비_원']),0),totalSubsidy=rows.reduce((a,r)=>a+numberValue(r['보조금액_원']),0),duplicate=rows.filter(r=>cleanText(r['3년내중복']).toUpperCase()==='Y').length,incomplete=rows.filter(r=>cleanText(r['증빙완비']).toUpperCase()!=='Y').length;document.getElementById('kpi').innerHTML=`<div class="kpi"><span>총 신청건수</span><b>${rows.length.toLocaleString()}건</b></div><div class="kpi"><span>적격</span><b>${eligible.toLocaleString()}건</b></div><div class="kpi"><span>반려</span><b>${rejected.toLocaleString()}건</b></div><div class="kpi"><span>반려율</span><b>${rows.length?(rejected/rows.length*100).toFixed(1):0}%</b></div><div class="kpi"><span>총 사업비</span><b>${money(totalCost)}</b></div><div class="kpi"><span>총 보조금</span><b>${money(totalSubsidy)}</b></div><div class="kpi"><span>3년 내 중복</span><b>${duplicate}건</b></div><div class="kpi"><span>증빙 미완비</span><b>${incomplete}건</b></div>`;const result=groupCount(rows,'심사결과'),reason=groupCount(rows.filter(r=>r['심사결과']==='반려'),'반려사유').filter(x=>x[0]!=='미상'),town=groupCount(rows,'읍면').slice(0,10),item=groupSum(rows,'지원품목','보조금액_원').slice(0,10),monthMap={};rows.forEach(r=>{const d=cleanText(r['접수일자']);const m=/^\d{4}[-./]\d{1,2}/.test(d)?d.substring(0,7):'기타';monthMap[m]=(monthMap[m]||0)+1});const months=Object.entries(monthMap).sort((a,b)=>a[0].localeCompare(b[0]));drawChart('resultChart','pie',result.map(x=>x[0]),result.map(x=>x[1]),'건수');drawChart('reasonChart','bar',reason.map(x=>x[0]),reason.map(x=>x[1]),'반려 건수');drawChart('townChart','bar',town.map(x=>x[0]),town.map(x=>x[1]),'신청 건수');drawChart('itemChart','bar',item.map(x=>x[0]),item.map(x=>x[1]),'보조금액');drawChart('monthChart','line',months.map(x=>x[0]),months.map(x=>x[1]),'신청 건수');const issues=rows.filter(r=>{const cost=numberValue(r['총사업비_원']),rate=numberValue(r['보조율_pct']),sub=numberValue(r['보조금액_원']);return(cost>0&&rate>0&&Math.abs(sub-cost*rate/100)>1000)||cleanText(r['3년내중복']).toUpperCase()==='Y'||cleanText(r['증빙완비']).toUpperCase()==='N'});document.getElementById('issueTitle').textContent=`이상·점검 대상 (${issues.length}건)`;document.getElementById('issueBody').innerHTML=issues.slice(0,100).map(r=>{const reasons=[],cost=numberValue(r['총사업비_원']),rate=numberValue(r['보조율_pct']),sub=numberValue(r['보조금액_원']);if(cost>0&&rate>0&&Math.abs(sub-cost*rate/100)>1000)reasons.push('보조금 계산 차이');if(cleanText(r['3년내중복']).toUpperCase()==='Y')reasons.push('3년 내 중복');if(cleanText(r['증빙완비']).toUpperCase()==='N')reasons.push('증빙 미완비');return `<tr><td>${r['신청번호']||''}</td><td>${r['농가명']||''}</td><td>${r['읍면']||''}</td><td>${reasons.join(', ')}</td><td>${money(sub)}</td></tr>`}).join('')||'<tr><td colspan="5">점검 대상이 없습니다.</td></tr>';showStatus(`분석 완료: ${rows.length.toLocaleString()}건을 불러왔습니다.`)}function parseCSV(text){text=text.replace(/^\uFEFF/,'');const row=[],result=[];let field='',inQuotes=false;for(let i=0;i<text.length;i++){const c=text[i],next=text[i+1];if(c==='"'){if(inQuotes&&next==='"'){field+='"';i++}else inQuotes=!inQuotes}else if(c===','&&!inQuotes){row.push(field);field=''}else if(c==='\n'&&!inQuotes){row.push(field);result.push(row.splice(0));field=''}else if(c!=='\r')field+=c}if(field.length||row.length){row.push(field);result.push(row)}const nonEmpty=result.filter(r=>r.some(v=>cleanText(v)!==''));if(nonEmpty.length<2)return[];const headers=nonEmpty[0].map(h=>cleanText(h).replace(/^\uFEFF/,''));return nonEmpty.slice(1).map(r=>{const o={};headers.forEach((h,i)=>o[h]=r[i]??'');return o})}async function readFile(file){const ext=file.name.split('.').pop().toLowerCase();if(ext==='xlsx'||ext==='xls'){if(!window.XLSX)throw new Error('Excel 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');const buffer=await file.arrayBuffer(),wb=XLSX.read(buffer,{type:'array'}),sheet=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false})}if(ext==='csv'){const buffer=await file.arrayBuffer();let text='';for(const enc of ['utf-8','euc-kr','windows-949']){try{const t=new TextDecoder(enc).decode(buffer);if(t&&t.split(/\r?\n/).length>1&&!t.includes('�')){text=t;break}}catch(e){}}if(!text)text=new TextDecoder('utf-8').decode(buffer);return parseCSV(text)}throw new Error('CSV, XLSX, XLS 파일만 지원합니다.')}document.getElementById('fileInput').addEventListener('change',async function(e){const file=e.target.files[0];if(!file)return;showStatus(`"${file.name}" 파일을 읽는 중입니다...`);try{renderDashboard(await readFile(file))}catch(err){console.error(err);showStatus('오류: '+err.message,true)}});</script></body></html>
